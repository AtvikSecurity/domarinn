[[remotes]]
git_url = "https://github.com/home-operations/.github"
ref = "main"
configs = ["lefthook.common.toml"]

# domarinn's workflows use the .yml extension; the shared zizmor hook only
# globs *.yaml, and remote config values win over same-key local overrides,
# so a separately-named command covers the .yml spelling.
[pre-commit.commands.zizmor-yml]
glob = [".github/workflows/*.yml", ".github/actions/**/action.yml"]
run = "zizmor --offline {staged_files}"

# Generated artifacts are drift-checked byte-for-byte in CI (schema-check /
# gen-types-check) — the shared formatters must never touch them. They are
# also .prettierignore'd; excluding them here as well keeps oxfmt from being
# handed an all-ignored file set (it exits non-zero on "no target files").
[pre-commit.commands.format-json]
exclude = ["domarinn.schema.json"]

[pre-commit.commands.format-yaml]
exclude = ["web/pnpm-lock.yaml", "web/pnpm-workspace.yaml"]

# Authored documentation stays untouched by the shared markdown formatter
# (same policy as kopiur's docs site). CHANGELOG.md is generated by Release
# Please — reformatting it here would produce a diff on every release that the
# next run then reverts.
[pre-commit.commands.format-markdown]
exclude = ["docs/**", "CHANGELOG.md"]

# A commit message release-please cannot parse is SKIPPED by it, not warned
# about — so the work never reaches a changelog, and if it is the only commit
# since the last release, no release pull request is created at all. That has
# happened once (see web/scripts/check-commit-msg.mjs for the exact shape).
#
# Skips silently when web/node_modules is absent so a fresh clone can still
# commit; CI runs the same checker unconditionally, which is the real gate.
[commit-msg.commands.conventional]
run = "test -d web/node_modules/@conventional-commits || exit 0; node web/scripts/check-commit-msg.mjs {1}"
