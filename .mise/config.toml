# mise configuration for domarinn.
#
# mise (https://mise.jdx.dev) pins the toolchain this repo needs and defines the
# task orchestration that previously lived in the justfile. This file lives at
# `.mise/config.toml`, a config location mise resolves natively (see
# https://mise.jdx.dev/configuration.html — "Paths which start with `mise` can
# be dotfiles, e.g.: `.mise.toml` or `.mise/config.toml`").
#
# Common commands:
#   mise install          # provision the pinned toolchain
#   mise tasks            # list the available tasks (replaces `just --list`)
#   mise run <task>       # run a task (replaces `just <task>`)

[settings]
# Maintain pinned tool versions + checksums in a lockfile. Because the config is
# `.mise/config.toml`, the lockfile is written alongside it as `.mise/mise.lock`
# (the lockfile is named like the config file with a `.lock` extension —
# https://mise.jdx.dev/configuration/settings.html#lockfile).
lockfile = true

# Node ships official precompiled binaries for every platform CI and developers
# use, so never build it from source. Some environments default `node.compile`
# to true, which makes `mise lock` bake source tarballs (`node-*.tar.gz`) with
# `install = "source"` into the lockfile — a 15-40 min cold build in CI. Pin it
# off so the lockfile always resolves precompiled Node.
[settings.node]
compile = false

[tools]
# Versions match what CI used before this migration: Rust stable
# (dtolnay/rust-toolchain@stable), Node 22 (actions/setup-node), pnpm 11
# (pnpm/action-setup). Loose versions here; Node and pnpm are pinned to exact
# versions + checksums in .mise/mise.lock. Rust tracks the rustup stable channel
# (not checksum-pinned; mise's core:rust backend delegates to rustup).
rust = "stable"
node = "24"
pnpm = "11"

# Git hooks + shared formatters (same setup as home-operations/kopiur): the
# hooks come from home-operations/.github's lefthook.common.toml (see
# .lefthook.toml) and are installed automatically by the postinstall hook at
# the bottom of this file whenever `mise install` runs.
lefthook = "2.1.10"
# `oxfmt` is distributed only via the npm backend (`mise registry oxfmt` →
# `npm:oxfmt`); node is pinned above, so the npm backend always uses mise's
# own node+npm rather than whatever is on PATH.
oxfmt = "0.63.0"
# The shared pre-commit hooks run zizmor on staged workflow files and
# shellcheck on staged *.sh files; pin both so the hooks resolve binaries.
zizmor = "1.29.0"
shellcheck = "0.11.0"
# The docs site (MkDocs + Material + pymdown-extensions) is pinned in
# pyproject.toml / uv.lock and run via uv, so the only mise-managed tool here is
# uv itself — it creates the locked venv on first `uv run`. Material bundles
# mermaid.js, so there are no committed site assets to regenerate. Run
# `uv lock` after bumping a docs dependency in pyproject.toml.
#
# Declared by its SHORT name, like every other tool here, and not as
# `aqua:astral-sh/uv`. Both resolve to the same aqua backend, but the lockfile
# is keyed by whichever spelling this file uses — so with the long form,
# `mise install --locked … uv` (what the docs workflow asks for) looks up `uv`,
# misses, and fails with "No lockfile URL found for uv@0.11.32".
uv = "0.12.3"
# The docs screenshot pipeline's seed script asserts data-at-rest hygiene with
# a jq filter over the runs API; pin it like every other CI-relevant tool.
jq = "1.8.2"

# --- Tasks (ported 1:1 from the former justfile) ---------------------------

[tasks.build]
description = "Full release build: compile the web UI, then the Rust workspace in release mode (the server crate embeds web/dist, so the UI must build first)."
run = ["pnpm -C web build", "cargo build --release"]

[tasks.build-cli]
description = "Fast release build of just the eval CLI (`domarinn`) at target/release/domarinn, skipping the web UI. The `server` subcommand serves a placeholder page until you build with the UI (`mise run build`)."
run = "cargo build --release -p domarinn-cli"

[tasks.install]
description = "Install the full `domarinn` (server UI embedded) into ~/.cargo/bin: build web/dist first, then `cargo install` the CLI. Use this if you want the `server` subcommand's web UI."
run = [
  "pnpm -C web build",
  "cargo install --path crates/domarinn-cli --locked --force",
]

[tasks.install-cli]
description = "Install just the eval CLI (`domarinn`) into ~/.cargo/bin, skipping the web UI (fast). The `server` subcommand serves a placeholder page; use `mise run install` for the embedded UI."
run = "cargo install --path crates/domarinn-cli --locked --force"

[tasks.install-musl]
description = "Install the static x86_64-musl `domarinn` (portable single binary, no web UI) into ~/.cargo/bin. Needs a musl C toolchain on the host (musl-gcc, e.g. Debian musl-tools) for rusqlite's bundled SQLite."
run = [
  "rustup target add x86_64-unknown-linux-musl",
  "cargo install --path crates/domarinn-cli --target x86_64-unknown-linux-musl --locked --force",
]

[tasks.dev]
description = "Run the results server + API on :8321 for local development (serves the embedded UI; run `pnpm -C web dev` alongside for live UI work)."
run = "cargo run -p domarinn-cli -- server"

[tasks.test]
description = "Run the Rust test suite."
run = "cargo test --workspace"

[tasks.test-pg]
description = "Run the server suite against the Postgres backend (needs Docker)."
# One shared postgres for all ~30 test binaries: exporting the URL keeps the
# testcontainers fallback (one container per binary) as the no-setup path for
# `cargo test` run by hand, without paying its startup cost here.
run = """
#!/usr/bin/env bash
set -euo pipefail
# max_connections raised: parallel test threads each hold a writer + reader
# connections across two logical handles, and the default 100 exhausts.
cid=$(docker run -d --rm -e POSTGRES_PASSWORD=postgres -p 127.0.0.1::5432 postgres:17-alpine -c max_connections=500)
trap 'docker stop "$cid" >/dev/null' EXIT
port=$(docker port "$cid" 5432/tcp | head -1 | awk -F: '{print $NF}')
for _ in $(seq 60); do
  docker exec "$cid" pg_isready -U postgres >/dev/null 2>&1 && break
  sleep 0.5
done
export DOMARINN_TEST_BACKEND=postgres
export DOMARINN_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:${port}/postgres"
cargo test -p domarinn-server
"""

[tasks.test-all]
description = "Run every test: Rust workspace tests + the web unit tests (vitest)."
depends = ["test"]
run = "pnpm -C web test"

[tasks.test-saml]
description = "Run the feature-gated SAML tests (the CI saml job). Needs libxmlsec1/libxml2/openssl dev packages + clang at build time (Debian: libxmlsec1-dev libxml2-dev libssl-dev clang; NixOS: nix-shell -p pkg-config xmlsec libxml2 libxslt openssl clang libtool, plus LIBCLANG_PATH/LD_LIBRARY_PATH — see docs/server.md)."
run = "cargo test -p domarinn-server --features saml"

[tasks.e2e]
description = "Run the web end-to-end tests (Playwright). Builds the mock UI and previews it via the config's webServer, so no Rust backend is required."
run = "pnpm -C web test:e2e"

[tasks.clippy]
description = "Clippy with warnings as errors. This is exactly what the CI clippy job runs."
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt-check]
description = "Check formatting without modifying anything. This is exactly what the CI fmt job runs."
run = "cargo fmt --all --check"

[tasks.lint]
description = "Lint: clippy as errors + a formatting check. Mirrors CI."
depends = ["clippy", "fmt-check"]

[tasks.fmt]
description = "Auto-format the workspace."
run = "cargo fmt"

[tasks.schema]
description = "Regenerate the config JSON Schema that editors and CI consume. Keep the result committed; CI fails if it drifts."
run = "cargo run -q -p domarinn-cli -- schema config > domarinn.schema.json"

[tasks.gen-types]
description = "Export TypeScript DTOs for the web UI from the Rust result/diff types. This directory is the web type source of truth; keep it committed. CI regenerates it and fails on drift."
run = "cargo run -q -p domarinn-cli -- gen-types web/src/api/generated"

# --- CI gates -----------------------------------------------------------------
# One task per CI job, so `mise run <task>` locally is byte-for-byte what CI
# runs (ci.yml invokes these same tasks). `mise run ci` runs the whole matrix.

[tasks.publish-dry-run]
description = "Verify domarinn-protocol is publishable to crates.io, without publishing it."
run = """
cargo publish -p domarinn-protocol --dry-run --allow-dirty
"""

[tasks.schema-check]
description = "Fail if the committed domarinn.schema.json has drifted from the generator (the CI schema-check job). Run `mise run schema` and commit to fix."
run = '''
#!/usr/bin/env bash
set -euo pipefail
# pipefail so a *compile* failure of the generator fails the task instead of
# being masked by diff's exit code (which would read as "schema out of date").
if ! cargo run -q -p domarinn-cli -- schema config | diff -u domarinn.schema.json -; then
  echo "domarinn.schema.json is out of date. Run 'mise run schema' and commit the result." >&2
  exit 1
fi
'''

[tasks.gen-types-check]
description = "Fail if web/src/api/generated has drifted from the Rust types (the CI gen-types-check job). Run `mise run gen-types` and commit to fix."
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo run -q -p domarinn-cli -- gen-types web/src/api/generated
if [ -z "$(git ls-files web/src/api/generated)" ]; then
  echo "web/src/api/generated is not committed. Run 'mise run gen-types' and commit the result." >&2
  exit 1
fi
# `git status --porcelain`, not `git diff`: newly-generated files that git diff
# can't see (untracked) must also count as drift.
if [ -n "$(git status --porcelain -- web/src/api/generated)" ]; then
  echo "web/src/api/generated is out of date. Run 'mise run gen-types' and commit the result." >&2
  git --no-pager status --porcelain -- web/src/api/generated >&2
  exit 1
fi
echo "generated types are up to date"
'''

[tasks.web-install]
description = "Install web dependencies exactly as CI does (frozen lockfile)."
run = "pnpm -C web install --frozen-lockfile"

[tasks.web-lint]
description = "Type-checked eslint over the web UI, warnings as errors (the CI web job's lint step)."
depends = ["web-install"]
run = "pnpm -C web lint"

[tasks.web-build]
description = "Type-check (tsc -b) and build the web UI (the CI web job's build step)."
depends = ["web-install"]
run = "pnpm -C web build"

[tasks.web-test]
description = "Run the web unit tests with vitest (the CI web job's test step)."
depends = ["web-install"]
run = "pnpm -C web test"

[tasks.musl-build]
description = "Static musl release build of the CLI (the CI musl-build job). Defaults to x86_64; set MUSL_TARGET to build another triple (CI builds aarch64 natively on an arm64 runner). Needs a musl C toolchain on the host (musl-gcc, e.g. Debian musl-tools) for rusqlite's bundled SQLite."
run = [
  "rustup target add ${MUSL_TARGET:-x86_64-unknown-linux-musl}",
  "cargo build --release --target ${MUSL_TARGET:-x86_64-unknown-linux-musl} -p domarinn-cli",
]

[tasks.ci-musl-build]
description = "The musl-build gate as `mise run ci` runs it: builds when a musl C toolchain is present, otherwise skips LOUDLY. This cannot weaken the real gate — the CI musl-build job apt-installs musl-tools and invokes the strict `musl-build` task directly; this wrapper exists only so `mise run ci` stays usable on dev machines without musl-gcc."
run = '''
if command -v musl-gcc >/dev/null 2>&1; then
  mise run musl-build
else
  echo "WARNING: musl-gcc not found - SKIPPING the static musl build gate." >&2
  echo "CI still enforces it; install a musl C toolchain (e.g. Debian musl-tools) to run it locally." >&2
fi
'''

[tasks.workflow-lint]
description = "Static-analyse the GitHub Actions workflows with zizmor (the CI workflow-lint job). Offline, so it matches the pre-commit hook in .lefthook.toml byte for byte."
run = "zizmor --offline .github/workflows/*.yml .github/actions/*/action.yml"

[tasks.docs]
description = "Build the full docs site (MkDocs user docs + the protocol crate's rustdoc) into site/. Fails on a broken link, a missing nav file, or a `--8<--` include pointing at a file that is not there."
run = "scripts/build-docs.sh"

[tasks.screenshots]
description = "Capture the docs' reference screenshots into docs/assets/screenshots/ from a real, seeded server: builds the UI if needed, brings up a local Ollama, seeds runs of the shipped examples, then drives Playwright. SKIP_LLM=1 skips Ollama and seeds only the offline examples; KEEP_SERVER=1 leaves the seeded server running afterwards."
run = "scripts/docs-screenshots.sh"

[tasks.docs-serve]
description = "Serve the docs locally with live reload on http://127.0.0.1:8000 (no rustdoc nesting, so the `Protocol API` link 404s here — build with `mise run docs` to see it)."
run = "uv run mkdocs serve"

[tasks.ci]
description = "Run every CI gate locally: clippy, fmt-check, tests (SQLite and Postgres), schema/type drift checks, the web pipeline, the static musl build (skipped loudly if no musl toolchain is installed), the docs build, and the workflow lint."
depends = [
  "clippy",
  "fmt-check",
  "test",
  "test-pg",
  "schema-check",
  "gen-types-check",
  "web-lint",
  "web-build",
  "web-test",
  "ci-musl-build",
  "docs",
  "workflow-lint",
]

[tasks.docker-build]
description = "Build the container image locally (multi-stage; produces the distroless image). Override the tag with DOMARINN_IMAGE / DOMARINN_TAG."
run = 'docker build -t "${DOMARINN_IMAGE:-ghcr.io/atviksecurity/domarinn}:${DOMARINN_TAG:-dev}" .'

[tasks.docker-push]
description = "Push the locally built image (requires `docker login ghcr.io`). Releases are published by CI; this is for ad-hoc images only."
depends = ["docker-build"]
run = 'docker push "${DOMARINN_IMAGE:-ghcr.io/atviksecurity/domarinn}:${DOMARINN_TAG:-dev}"'

[hooks]
# Install the lefthook git hooks (see .lefthook.toml) whenever the toolchain
# is provisioned, so every clone gets the pre-commit formatters for free.
# Guarded: CI provisions subsets of the toolchain (mise-action install_args),
# where lefthook may be absent and hooks are pointless anyway.
postinstall = "command -v lefthook >/dev/null 2>&1 && lefthook install || true"
