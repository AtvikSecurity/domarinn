# mise configuration for measurellm.
#
# mise (https://mise.jdx.dev) pins the toolchain this repo needs and defines the
# task orchestration that previously lived in the justfile. This file lives at
# `.mise/config.toml`, a config location mise resolves natively (see
# https://mise.jdx.dev/configuration.html — "Paths which start with `mise` can
# be dotfiles, e.g.: `.mise.toml` or `.mise/config.toml`").
#
# Common commands:
#   mise install          # provision the pinned toolchain
#   mise tasks            # list the available tasks (replaces `just --list`)
#   mise run <task>       # run a task (replaces `just <task>`)

[settings]
# Maintain pinned tool versions + checksums in a lockfile. Because the config is
# `.mise/config.toml`, the lockfile is written alongside it as `.mise/mise.lock`
# (the lockfile is named like the config file with a `.lock` extension —
# https://mise.jdx.dev/configuration/settings.html#lockfile).
lockfile = true

# Node ships official precompiled binaries for every platform CI and developers
# use, so never build it from source. Some environments default `node.compile`
# to true, which makes `mise lock` bake source tarballs (`node-*.tar.gz`) with
# `install = "source"` into the lockfile — a 15-40 min cold build in CI. Pin it
# off so the lockfile always resolves precompiled Node.
[settings.node]
compile = false

[tools]
# Versions match what CI used before this migration: Rust stable
# (dtolnay/rust-toolchain@stable), Node 22 (actions/setup-node), pnpm 11
# (pnpm/action-setup). Loose versions here; Node and pnpm are pinned to exact
# versions + checksums in .mise/mise.lock. Rust tracks the rustup stable channel
# (not checksum-pinned; mise's core:rust backend delegates to rustup).
rust = "stable"
node = "24"
pnpm = "11"

# Git hooks + shared formatters (same setup as home-operations/kopiur): the
# hooks come from home-operations/.github's lefthook.common.toml (see
# .lefthook.toml) and are installed automatically by the postinstall hook at
# the bottom of this file whenever `mise install` runs.
lefthook = "2.1.10"
# `oxfmt` is distributed only via the npm backend (`mise registry oxfmt` →
# `npm:oxfmt`); node is pinned above, so the npm backend always uses mise's
# own node+npm rather than whatever is on PATH.
oxfmt = "0.59.0"
# The shared pre-commit hooks run zizmor on staged workflow files and
# shellcheck on staged *.sh files; pin both so the hooks resolve binaries.
zizmor = "1.27.0"
shellcheck = "0.11.0"

# --- Tasks (ported 1:1 from the former justfile) ---------------------------

[tasks.build]
description = "Full release build: compile the web UI, then the Rust workspace in release mode (the server crate embeds web/dist, so the UI must build first)."
run = ["pnpm -C web build", "cargo build --release"]

[tasks.dev]
description = "Run the results server + API on :8321 for local development (serves the embedded UI; run `pnpm -C web dev` alongside for live UI work)."
run = "cargo run -p measurellm-cli -- server"

[tasks.test]
description = "Run the Rust test suite."
run = "cargo test --workspace"

[tasks.test-all]
description = "Run every test: Rust workspace tests + the web unit tests (vitest)."
depends = ["test"]
run = "pnpm -C web test"

[tasks.e2e]
description = "Run the web end-to-end tests (Playwright). Builds the mock UI and previews it via the config's webServer, so no Rust backend is required."
run = "pnpm -C web test:e2e"

[tasks.clippy]
description = "Clippy with warnings as errors. This is exactly what the CI clippy job runs."
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt-check]
description = "Check formatting without modifying anything. This is exactly what the CI fmt job runs."
run = "cargo fmt --all --check"

[tasks.lint]
description = "Lint: clippy as errors + a formatting check. Mirrors CI."
depends = ["clippy", "fmt-check"]

[tasks.fmt]
description = "Auto-format the workspace."
run = "cargo fmt"

[tasks.schema]
description = "Regenerate the config JSON Schema that editors and CI consume. Keep the result committed; CI fails if it drifts."
run = "cargo run -q -p measurellm-cli -- schema config > measurellm.schema.json"

[tasks.gen-types]
description = "Export TypeScript DTOs for the web UI from the Rust result/diff types. This directory is the web type source of truth; keep it committed. CI regenerates it and fails on drift."
run = "cargo run -q -p measurellm-cli -- gen-types web/src/api/generated"

# --- CI gates -----------------------------------------------------------------
# One task per CI job, so `mise run <task>` locally is byte-for-byte what CI
# runs (ci.yml invokes these same tasks). `mise run ci` runs the whole matrix.

[tasks.schema-check]
description = "Fail if the committed measurellm.schema.json has drifted from the generator (the CI schema-check job). Run `mise run schema` and commit to fix."
run = '''
#!/usr/bin/env bash
set -euo pipefail
# pipefail so a *compile* failure of the generator fails the task instead of
# being masked by diff's exit code (which would read as "schema out of date").
if ! cargo run -q -p measurellm-cli -- schema config | diff -u measurellm.schema.json -; then
  echo "measurellm.schema.json is out of date. Run 'mise run schema' and commit the result." >&2
  exit 1
fi
'''

[tasks.gen-types-check]
description = "Fail if web/src/api/generated has drifted from the Rust types (the CI gen-types-check job). Run `mise run gen-types` and commit to fix."
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo run -q -p measurellm-cli -- gen-types web/src/api/generated
if [ -z "$(git ls-files web/src/api/generated)" ]; then
  echo "web/src/api/generated is not committed. Run 'mise run gen-types' and commit the result." >&2
  exit 1
fi
# `git status --porcelain`, not `git diff`: newly-generated files that git diff
# can't see (untracked) must also count as drift.
if [ -n "$(git status --porcelain -- web/src/api/generated)" ]; then
  echo "web/src/api/generated is out of date. Run 'mise run gen-types' and commit the result." >&2
  git --no-pager status --porcelain -- web/src/api/generated >&2
  exit 1
fi
echo "generated types are up to date"
'''

[tasks.web-install]
description = "Install web dependencies exactly as CI does (frozen lockfile)."
run = "pnpm -C web install --frozen-lockfile"

[tasks.web-lint]
description = "Type-checked eslint over the web UI, warnings as errors (the CI web job's lint step)."
depends = ["web-install"]
run = "pnpm -C web lint"

[tasks.web-build]
description = "Type-check (tsc -b) and build the web UI (the CI web job's build step)."
depends = ["web-install"]
run = "pnpm -C web build"

[tasks.web-test]
description = "Run the web unit tests with vitest (the CI web job's test step)."
depends = ["web-install"]
run = "pnpm -C web test"

[tasks.musl-build]
description = "Static x86_64 musl release build of the CLI (the CI musl-build job). Needs a musl C toolchain on the host (musl-gcc, e.g. Debian musl-tools) for rusqlite's bundled SQLite."
run = [
  "rustup target add x86_64-unknown-linux-musl",
  "cargo build --release --target x86_64-unknown-linux-musl -p measurellm-cli",
]

[tasks.ci]
description = "Run every CI gate locally: clippy, fmt-check, tests, schema/type drift checks, the web pipeline, and the static musl build."
depends = [
  "clippy",
  "fmt-check",
  "test",
  "schema-check",
  "gen-types-check",
  "web-lint",
  "web-build",
  "web-test",
  "musl-build",
]

[tasks.docker-build]
description = "Build the container image locally (multi-stage; produces the distroless image). Override the tag with MEASURELLM_IMAGE / MEASURELLM_TAG."
run = 'docker build -t "${MEASURELLM_IMAGE:-ghcr.io/atviksecurity/measurellm}:${MEASURELLM_TAG:-dev}" .'

[tasks.docker-push]
description = "Push the locally built image (requires `docker login ghcr.io`)."
depends = ["docker-build"]
run = 'docker push "${MEASURELLM_IMAGE:-ghcr.io/atviksecurity/measurellm}:${MEASURELLM_TAG:-dev}"'

[hooks]
# Install the lefthook git hooks (see .lefthook.toml) whenever the toolchain
# is provisioned, so every clone gets the pre-commit formatters for free.
# Guarded: CI provisions subsets of the toolchain (mise-action install_args),
# where lefthook may be absent and hooks are pointless anyway.
postinstall = "command -v lefthook >/dev/null 2>&1 && lefthook install || true"
