# MkDocs configuration for the domarinn documentation site.
#
# The book source is the `docs/` tree, so in-repo references to docs/*.md keep
# resolving on GitHub as well as on the site. There is no SUMMARY.md — page
# order and grouping live in `nav:` below, and any docs/*.md NOT in `nav:`
# builds but is unlinked (mkdocs --strict warns about it).
#
# `mise run docs` (scripts/build-docs.sh) builds this site *and* nests the
# rustdoc for the publishable protocol crate under /rustdoc/. The site is
# published to the custom domain https://docs.domarinn.com/ (served at the
# root, so site_url ends "/"). The domain is pinned by the CNAME file
# scripts/build-docs.sh writes into the artifact; the repo's
# Settings -> Pages custom-domain field must match.
#
# The MkDocs + Material toolchain is pinned in pyproject.toml / uv.lock and run
# via uv (see .mise/config.toml). Material bundles mermaid.js and the admonition
# styling, so there are no committed preprocessor assets to regenerate.
site_name: domarinn
site_description: A declarative LLM eval harness — one static binary that is a CLI, an eval engine, and a self-hostable results server.
site_author: domarinn contributors
site_url: https://docs.domarinn.com/

repo_url: https://github.com/AtvikSecurity/domarinn
repo_name: AtvikSecurity/domarinn
# Appended to repo_url + a doc's path relative to docs_dir, e.g.
# .../edit/main/docs/start/install.md
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# Session working notes (plans, specs) live under docs/superpowers/ so they sit
# beside the work they describe, but they are not part of the published book.
# Excluded rather than added to `nav:` — with `omitted_files: warn` and
# `--strict`, an untracked scratch file appearing there would otherwise fail the
# docs build for whoever happens to have one on disk.
exclude_docs: |
  superpowers/

# Fail the build on a broken internal link or a nav entry pointing at a missing
# file. This is our doc lint; build-docs.sh and CI pass --strict, which promotes
# these warnings to errors.
validation:
  links:
    absolute_links: relative_to_docs
    not_found: warn
    anchors: warn
  nav:
    omitted_files: warn

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # navigation.tabs is deliberately OFF: with it on, the top-level groups
    # render as a horizontal tab bar in the header; off, the whole tree lives in
    # the left sidebar as collapsible sections, which is what we want.
    - navigation.indexes # a section's first child can be its landing page
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    # Selecting a tab (e.g. "Anthropic") switches every same-labeled tab group
    # on the page and persists the choice. Labels must be byte-identical across
    # groups to link.
    - content.tabs.link

markdown_extensions:
  # Admonitions use the pymdownx "blocks" syntax (/// note | Title ... ///)
  # rather than the indented `!!! note` form ON PURPOSE: the pre-commit hook
  # runs `oxfmt` over markdown, and oxfmt (a CommonMark formatter) strips the
  # 4-space body indentation that `!!! note` requires, silently breaking every
  # admonition. The blocks form keeps its body at column 0, so oxfmt leaves it
  # intact. docs/** is currently excluded from that hook, but examples and any
  # future included file are not — and an admonition syntax that only survives
  # by exclusion is one bad day from breaking.
  # (Convention: keep a blank line before the closing /// so oxfmt doesn't fold
  # it into a preceding list item.)
  - pymdownx.blocks.admonition:
      # The blocks extension only activates for the type names registered here
      # (its built-in default list does NOT include `info`, which the docs use).
      # Each name doubles as the Material CSS class, so this is the canonical
      # Material admonition set.
      types:
        - note
        - abstract
        - info
        - tip
        - success
        - question
        - warning
        - failure
        - danger
        - bug
        - example
        - quote
  - pymdownx.blocks.details # collapsible admonitions
  # Content tabs use the blocks syntax (/// tab | Anthropic ... ///) for the
  # same oxfmt reason as the admonitions above. alternate_style is Material's
  # tabbed look (the legacy style is unmaintained upstream). Same
  # blank-line-before-/// rule, and never indent the option lines.
  - pymdownx.blocks.tab:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      # GitHub-compatible heading slugs (does NOT collapse consecutive dashes),
      # so anchors like #example-01--hello-eval — produced by "## Example 01 —
      # Hello, eval" — match both the in-repo cross-links and how GitHub renders
      # the same .md files. Python-Markdown's default slugify would collapse the
      # "--" to "-" and break every example deep-link.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        # ```mermaid fenced diagrams, rendered by Material's bundled mermaid.js.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      # base_path = repo root so a page can transclude the real, runnable suite
      # from examples/ rather than carrying a copy of it:
      #   --8<-- "examples/01-hello-eval/domarinn.yaml"
      # That is what makes "every example in the docs is tested" structural: the
      # page and crates/domarinn-cli/tests/examples/table.rs read the same bytes.
      # check_paths fails the build on a missing or renamed example.
      base_path:
        - "."
      check_paths: true

plugins:
  - search
  # Old -> new page moves get an entry here so a published URL never 404s once
  # the page is gone. mkdocs-redirects writes a static HTML stub at the old
  # path whose JS carries over any URL fragment (#anchor) to the new page, so
  # deep links keep working too; scripts/build-docs.sh verifies every entry
  # against the built site. The first five entries below are the
  # reference-section restructure: each old top-level page moved under
  # reference/ (configuration.md was also retitled to domarinn-yaml.md). The
  # examples split needs no entry here: it kept /examples/ itself alive (its
  # index reoccupies the old URL, so there is no old path to stub), and the old
  # per-example anchors are forwarded by a script on docs/examples/index.md
  # instead. server.md and deploy.md are the server split: the old top-level
  # server.md moved to reference/server.md (its REST API and MCP sections
  # split further into their own reference/ pages, which need no redirect of
  # their own since those URLs never existed before), and deploy.md became the
  # self-hosting guide under guides/. The eleven entries below are the guides
  # restructure: scenarios/* moved under guides/ (regression-gate.md's content
  # merged into gate-in-ci.md rather than moving 1:1, so both its old path and
  # ci.md's old path redirect there), and getting-started.md split into
  # start/install.md + start/first-eval.md — the old URL forwards to the
  # latter since that is where most of the page's content (and its inbound
  # links) landed; start/install.md has no old URL to redirect from.
  - redirects:
      redirect_maps:
        configuration.md: reference/domarinn-yaml.md
        providers.md: reference/providers.md
        assertions.md: reference/assertions.md
        cli.md: reference/cli.md
        protocol.md: reference/protocol.md
        server.md: reference/server.md
        deploy.md: guides/self-host.md
        grading.md: concepts/grading.md
        caching.md: concepts/caching.md
        statistics.md: concepts/statistics.md
        getting-started.md: start/first-eval.md
        ci.md: guides/gate-in-ci.md
        migrate-promptfoo.md: guides/migrate-promptfoo.md
        troubleshooting.md: guides/troubleshooting.md
        scenarios/index.md: guides/index.md
        scenarios/render-gate.md: guides/render-gate.md
        scenarios/grade-against-policy.md: guides/grade-against-policy.md
        scenarios/structured-output.md: guides/structured-output.md
        scenarios/regression-gate.md: guides/gate-in-ci.md
        scenarios/shared-cache.md: guides/share-cache-and-baselines.md
        scenarios/evaluate-your-app.md: guides/evaluate-your-app.md

nav:
  - Introduction: index.md
  - Start here:
      - Install: start/install.md
      - Your first eval: start/first-eval.md
  - Concepts:
      - How a run works: concepts/how-a-run-works.md
      - Architecture — one binary: concepts/architecture.md
      - Providers & the exec boundary: concepts/exec-boundary.md
      - Grading: concepts/grading.md
      - The one-rule cache: concepts/caching.md
      - Statistics: concepts/statistics.md
      - Why domarinn is built this way: concepts/why-domarinn.md
  # Guides = end-to-end, problem-driven walkthroughs, as opposed to the
  # per-capability ladder grouped under examples/. navigation.indexes makes
  # guides/index.md the section landing page, so it must be the first child.
  - Guides:
      - guides/index.md
      - Test a model API: guides/test-a-model-api.md
      - Test your app via exec: guides/evaluate-your-app.md
      - Test an HTTP endpoint: guides/test-an-http-endpoint.md
      - Local LLMs with Ollama: guides/local-llms.md
      - A zero-cost gate on every PR: guides/render-gate.md
      - Gate a PR in CI: guides/gate-in-ci.md
      - Grade an assistant against a policy: guides/grade-against-policy.md
      - Evaluate structured output: guides/structured-output.md
      - Share a cache and baselines: guides/share-cache-and-baselines.md
      - Self-host the server: guides/self-host.md
      - Migrate from promptfoo: guides/migrate-promptfoo.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - domarinn.yaml: reference/domarinn-yaml.md
      - Providers: reference/providers.md
      - Assertions: reference/assertions.md
      - CLI: reference/cli.md
      - Server: reference/server.md
      - REST API: reference/rest-api.md
      - MCP endpoint: reference/mcp.md
      - Exec protocol: reference/protocol.md
      - The web UI: reference/web-ui.md
  # No example-number ranges in these labels: nothing would keep them true
  # when the ladder grows, and the guarded index table already maps every
  # number to its page (crates/domarinn-cli/tests/examples.rs).
  - Examples:
      - examples/index.md
      - First steps: examples/first-steps.md
      - Templates & test data: examples/templates-and-test-data.md
      - Your own system: examples/your-own-system.md
      - Running & reporting: examples/running-and-reporting.md
      - Caching & statistics: examples/caching-and-statistics.md
      - Models, grading & budgets: examples/models-grading-and-budgets.md
  # A top-level entry so the Rust API docs are one click from the top of every
  # page. Root-absolute link into the rustdoc tree build-docs.sh nests at
  # /rustdoc/; it exists in the assembled site/ and in production, but NOT
  # during `mkdocs serve` (which builds no rustdoc).
  - Rust API ↗: /rustdoc/index.html
