# yaml-language-server: $schema=../../domarinn.schema.json
#
# Not paying twice for the same answer.
#
# Every provider response is cached, content-addressed, on by default. Run this
# suite twice and the second run does no work at all — it prints the same report
# from the cache, instantly and for free.
#
# The rule the key follows is one sentence:
#
#     Hash what is sent. Name what receives it.
#
# The rendered prompt, the vars and the tools ARE the request, so they are
# hashed. `command`, `model`, `url` and `headers` SELECT a provider, so they go
# in verbatim. Nothing else — and in particular nothing about your filesystem:
# no path, no mtime, no digest of the program's own bytes.
#
# That last clause is what makes a cache shareable. A key that varies by machine
# cannot be reused by anyone else, which quietly turns a shared cache into an
# expensive local disk.
#
# Three consequences worth knowing:
#   * one entry per key, immutable — first write wins, on every backend
#   * errors are NEVER cached; only successful responses are
#   * `latency` assertions bypass the cache entirely, because a replayed
#     response has no honest latency to report
#
# Run it twice and watch the second run:
#   domarinn run examples/21-caching-basics
#   domarinn run examples/21-caching-basics     # every cell a cache hit
#
# To force real work:  --no-cache
# To require the cache: --cache-only   (a miss becomes an infra error, exit 3)
version: 1
project: examples
suite: caching-basics

providers:
  - id: assistant
    type: exec
    command: ["python3", "../echo-provider.py"]
    # An exec provider's fingerprint is its command, which says nothing about
    # the program's bytes — so a rebuild does NOT invalidate anything on its
    # own. See example 22 for what to do about that.
    cache_salt: "dev"

cache:
  # `disk` (the default) stores under `.domarinn/cache` beside this suite.
  # `layered` puts a shared tier behind that local one — S3 when a `cache.s3`
  # block is set, else the results server. (`http` and `s3` are deprecated
  # aliases for it.) Note the config names only the KIND — the URL and
  # credentials come from the environment, so a suite is safe to commit.
  backend: disk

# Grader requests are cached too, on by default. Pass `--no-grader-cache` while
# iterating on a rubric, when you want the judge re-consulted every time.

tests:
  - id: summary/short
    vars:
      user_input: "The meeting moved to Thursday at 10."
    assert:
      - type: icontains
        value: "thursday"
  - id: summary/long
    vars:
      user_input: "Deployment is blocked on the migration; expect Friday."
    assert:
      - type: icontains
        value: "friday"
  - id: summary/empty-ish
    vars:
      user_input: "noted"
    assert:
      - type: length
        min: 1
