# yaml-language-server: $schema=../../measurellm.schema.json
#
# A render-health suite: it exercises an external "system under test" (here the
# testkit fake provider) and grades its output with deterministic, zero-LLM
# assertions. No API key required.
version: 1
project: examples
suite: render-health

providers:
  - id: renderer
    type: exec
    command: ["fake-provider"]
    timeout_ms: 30000
    # A rebuilt binary should not serve stale cache; bump this to a git SHA / hash.
    cache_salt: "dev"

tests:
  # A literal SSTI payload that must NEVER be interpolated: !raw keeps it verbatim.
  - id: adversarial/ssti-literal
    tags: [adversarial]
    vars:
      user_input: !raw "{{7*7}} {% for x in range(9) %}x{% endfor %}"
    assert:
      - type: not-contains
        value: "49"

  - id: greeting/basic
    tags: [smoke]
    vars:
      user_input: "hello world"
    assert:
      - type: contains
        value: "hello"
      - type: length
        max: 200000

defaults:
  assert:
    - type: is-json
      # every rendered output is echoed as JSON by the fake provider
