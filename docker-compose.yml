# domarinn — single-service self-host.
#
# Storage is SQLite by default, and SQLite is a single writer: as long as
# that default holds, this is intentionally ONE replica with a persistent
# volume — do not scale this service to >1. The optional Postgres backend
# below (DOMARINN_DATABASE_URL + the `postgres` profile) lifts that limit;
# see docs/guides/self-host.md.
#
#   docker compose up -d
#   # UI + API on http://localhost:8321

services:
  domarinn:
    # Pull the published image...
    #image: ghcr.io/atviksecurity/domarinn:rolling
    # ...or build locally instead by uncommenting this and commenting `image`:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domarinn
    restart: unless-stopped
    ports:
      - "8321:8321"
    environment:
      # Where the SQLite db + cache live inside the container (mapped to the
      # named volume below). Matches the image default; shown for clarity.
      # Still required with the Postgres backend — it keeps the local cache
      # tier there.
      DOMARINN_DATA_DIR: /data

      # --- Postgres backend (optional; off by default) ---
      # Storage is SQLite under /data unless this is set. Point it at a
      # Postgres database and ALL durable state (runs, users, sessions, keys,
      # baselines, the shared cache) moves there — which also makes >1 replica
      # supported. The `postgres` service below (behind its own profile)
      # provides a matching database:
      #
      #   docker compose --profile postgres up -d
      #
      # with, in the `.env` beside this file (the passwords must match):
      #
      #   DOMARINN_DATABASE_URL=postgres://domarinn:CHANGE_ME_db_password@postgres:5432/domarinn
      #   POSTGRES_PASSWORD=CHANGE_ME_db_password
      #
      # Empty (the default) means SQLite. To carry existing SQLite data over,
      # run `domarinn migrate-db` first; see docs/guides/self-host.md.
      DOMARINN_DATABASE_URL: "${DOMARINN_DATABASE_URL:-}"

      # The server is CLOSED by default: every page and API call requires
      # auth, and the first visit walks you through creating the admin (or
      # seed one via DOMARINN_ADMIN_USER / DOMARINN_ADMIN_PASSWORD below).
      # Anonymous access is an explicit opt-out:
      #DOMARINN_AUTH_MODE: "protect-writes"   # anonymous reads, gated writes
      #DOMARINN_AUTH_MODE: "open"             # no auth at all

      # Seed the admin account from the environment (idempotent on startup).
      # Inject via a real secret store, not this file, in production.
      #DOMARINN_ADMIN_USER: "admin"
      #DOMARINN_ADMIN_PASSWORD: "CHANGE_ME_admin_password"

      # Static bearer tokens for CI/bootstrap. Comma-separated "scope:secret"
      # pairs — the scope must be read, write, or admin (anything else is
      # ignored). REPLACE these placeholder secrets before exposing the
      # service — treat them like passwords and inject via a real secret
      # store, not this file, in production.
      DOMARINN_TOKENS: "write:CHANGE_ME_ci_token,read:CHANGE_ME_view_token"

      # Public base URL the server prints in share links and uses to build
      # absolute URLs behind a reverse proxy. No trailing slash, no path
      # prefix. REQUIRED if you enable SSO below.
      #
      # Set it per deployment in a `.env` beside this file (gitignored) rather
      # than editing it here — a hard-coded origin is wrong for every host but
      # the one that wrote it, and silently sends share links and SSO callbacks
      # somewhere unreachable:
      #
      #   DOMARINN_PUBLIC_URL=https://domarinn.example.com
      DOMARINN_PUBLIC_URL: "${DOMARINN_PUBLIC_URL:-http://localhost:8321}"

      # Session cookies are Secure whenever the public URL is https, so this
      # normally needs no setting at all. Override it to "false" ONLY for a
      # deployment reached over plain HTTP (a LAN box, a local trial) — the
      # browser would otherwise refuse to store the cookie and nobody could
      # stay signed in. Never set it on an internet-facing server.
      DOMARINN_COOKIE_SECURE: "${DOMARINN_COOKIE_SECURE:-}"

      # --- Single sign-on (optional) — see
      # docs/reference/server.md#single-sign-on-oidc--saml ---
      # OIDC (Google, Authentik, Okta, Entra, Keycloak, …):
      #DOMARINN_OIDC_PROVIDERS: "authentik"
      #DOMARINN_OIDC_AUTHENTIK_ISSUER: "https://auth.example.com/application/o/domarinn/"
      #DOMARINN_OIDC_AUTHENTIK_CLIENT_ID: "CHANGE_ME"
      #DOMARINN_OIDC_AUTHENTIK_CLIENT_SECRET: "CHANGE_ME"
      #DOMARINN_OIDC_AUTHENTIK_ADMIN_GROUPS: "domarinn-admins"
      # SAML (needs the SAML-enabled image, which this Dockerfile builds):
      #DOMARINN_SAML_PROVIDERS: "okta"
      #DOMARINN_SAML_OKTA_IDP_METADATA_URL: "https://example.okta.com/app/…/sso/saml/metadata"
      #DOMARINN_SAML_OKTA_ADMIN_GROUPS: "domarinn-admins"
    volumes:
      - domarinn-data:/data
    healthcheck:
      # The binary is its own probe (distroless has no shell/curl).
      test: ["CMD", "/domarinn", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Postgres (optional; off by default) -----------------------------
  #
  # The opt-in storage backend: one Postgres database holds everything the
  # SQLite files hold, and — unlike SQLite — supports several domarinn
  # replicas sharing it. It lives behind its own compose profile: nothing in
  # the `domarinn` service above depends on it, and a plain `docker compose
  # up` never starts it. Enable it together with DOMARINN_DATABASE_URL above
  # (both via the same `.env`):
  #
  #   docker compose --profile postgres up -d
  #
  # See docs/guides/self-host.md for the full walkthrough, including
  # migrating an existing SQLite deployment with `domarinn migrate-db`.
  postgres:
    image: postgres:18-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: domarinn
      POSTGRES_DB: domarinn
      # Must match the password inside DOMARINN_DATABASE_URL — set both in
      # the `.env`, and treat it like every other secret in this file.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME_db_password}"
      # The C locale sorts text bytewise, matching SQLite's ordering exactly.
      # Recommended, not required; see docs/reference/server.md#storage.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domarinn -d domarinn"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Ollama (optional; off by default) -------------------------------
  #
  # A local OpenAI-compatible endpoint for suites that call a model — no API
  # key, no network egress. It lives behind its own compose profile: nothing
  # in the `domarinn` service above depends on it, and a plain `docker compose
  # up` never starts it.
  #
  #   docker compose --profile ollama up -d --wait ollama
  #   docker compose --profile ollama exec ollama ollama pull qwen3:4b
  #   OPENAI_BASE_URL=http://localhost:11434/v1 domarinn run examples/26-openai-provider
  #
  # See docs/guides/local-llms.md for the full walkthrough (remote GPU hosts,
  # which examples run locally, and the model recommendations).
  ollama:
    image: ollama/ollama:0.32.13
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Uncomment to run on an NVIDIA GPU (needs the NVIDIA Container Toolkit on
    # the host):
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: all
    #          capabilities: [gpu]

volumes:
  domarinn-data:
  postgres-data:
  ollama-models:
