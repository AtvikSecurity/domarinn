[package]
name = "domarinn-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Fake exec-protocol programs for domarinn's tests (not published)"
publish = false

[dependencies]
# Deliberately built through the published protocol types rather than ad-hoc
# `json!` literals: this binary is the workspace's stand-in for a third-party
# provider, so if `domarinn-protocol` ever grows an awkward shape or a heavy
# dependency, it shows up here first.
domarinn-protocol = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "fake-provider"
path = "src/bin/fake_provider.rs"

[dev-dependencies]
domarinn-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tempfile = "3"
