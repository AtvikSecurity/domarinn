[package]
name = "domarinn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core eval engine, config schema, and traits for domarinn"

[dependencies]
domarinn-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
serde_path_to_error = { workspace = true }
schemars = { workspace = true }
ts-rs = { version = "12", features = ["serde-json-impl", "chrono-impl", "no-serde-warnings"] }
minijinja = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = "0.3"
csv = "1"
regex = "1"
base64 = "0.23"
md-5 = "0.11"
glob = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
sha2 = { workspace = true }
blake3 = { workspace = true }
ulid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
globset = { workspace = true }
chrono = { workspace = true }
# Approved new dependency: run provenance (`RunOrigin.actor`/`host`) needs the OS
# username and hostname. Env-var sniffing is not a substitute — `HOSTNAME` is a
# bash *shell* variable rather than an exported one, so it is unset in exactly
# the containers and CI runners where the value matters most.
whoami = "2"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
wiremock = "0.6"
tracing-subscriber = { workspace = true }
