[package]
name = "domarinn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core eval engine, config schema, and traits for domarinn"

[dependencies]
domarinn-protocol = { workspace = true }
domarinn-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
serde_path_to_error = { workspace = true }
schemars = { workspace = true }
ts-rs = { version = "12", features = ["serde-json-impl", "chrono-impl", "no-serde-warnings"] }
minijinja = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = "0.3"
csv = "1"
regex = "1"
base64 = "0.23"
md-5 = "0.11"
glob = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
sha2 = { workspace = true }
blake3 = { workspace = true }
ulid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
globset = { workspace = true }
chrono = { workspace = true }
# Approved new dependency: run provenance (`RunOrigin.actor`/`host`) needs the OS
# username and hostname. Env-var sniffing is not a substitute — `HOSTNAME` is a
# bash *shell* variable rather than an exported one, so it is unset in exactly
# the containers and CI runners where the value matters most.
whoami = "2"
# Approved new dependency: `contains-json`'s `schema` field was in the public
# config schema, documented, and validated nothing — a user could write a schema
# and get a pass that checked it against nothing.
#
# `default-features = false` is a security requirement, not a size one: it drops
# `resolve-http` and `resolve-file`, so a `$ref` in a suite's schema can never
# become an outbound request or a filesystem read during a run. The
# network-refusal test in `jsonschema_cache.rs` is what keeps that true across a
# Renovate bump, which this repo automerges after a soak.
#
# Pinned below 0.49 deliberately: that release requires rustc 1.85 and would
# silently raise the MSRV declared in the workspace manifest, which no CI job
# builds at.
jsonschema = { version = "0.46", default-features = false }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
wiremock = "0.6"
tracing-subscriber = { workspace = true }
