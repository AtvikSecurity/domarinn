[package]
name = "domarinn-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Self-hostable results server and web UI for domarinn"

[dependencies]
domarinn-core = { workspace = true }
axum = "0.8"
tokio = { workspace = true }
tower = "0.5"
tower-http = { version = "0.7", features = [
    "trace",
    "compression-gzip",
    "decompression-gzip",
    "limit",
    "request-id",
] }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { version = "12", features = [] }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
zstd = "0.13"
sha2 = { workspace = true }
hex = "0.4"
subtle = "2"
argon2 = "0.5"
cookie = "0.18"
rand = "0.10"
ulid = { workspace = true }
bytes = "1"
rust-embed = "8"
mime_guess = "2"
openidconnect = { version = "4", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
samael = { version = "0.0.22", features = ["xmlsec"], optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
flate2 = "1"
ulid = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
openidconnect = { version = "4", default-features = false }
url = "2"

[features]
# SAML SP support. Off by default because samael's xmlsec backend needs C
# libraries (libxmlsec1/libxml2/openssl) at build time; the Docker/release
# build and the dedicated CI job enable it. A binary built without it
# hard-errors at startup if DOMARINN_SAML_PROVIDERS is set.
saml = ["dep:samael", "dep:base64"]
