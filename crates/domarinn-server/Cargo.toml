[package]
name = "domarinn-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Self-hostable results server and web UI for domarinn"

[dependencies]
domarinn-core = { workspace = true }
# Local disk backend only, for the read-only browse tier. `default-features =
# false` keeps `object_store` and the AWS stack out of this build.
domarinn-cache = { workspace = true }
axum = "0.8"
tokio = { workspace = true }
tower = "0.5"
tower-http = { version = "0.7", features = [
    "trace",
    "compression-gzip",
    "decompression-gzip",
    "limit",
    "request-id",
    # Only ever layered on the MCP route, never the shared router — the rest of
    # the API is same-origin by design. See `mcp::origin`.
    "cors",
] }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { version = "12", features = [] }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
# Postgres backend: pure Rust end to end. The sync `postgres` facade fits the
# blocking closure model in `storage::Db`; TLS is rustls pinned to the `ring`
# provider (never aws-lc-rs — see the Dockerfile header) with bundled webpki
# roots, so the musl/static and distroless `ldd` gates are unaffected.
postgres = "0.19"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
zstd = "0.13"
sha2 = { workspace = true }
hex = "0.4"
subtle = "2"
argon2 = "0.5"
cookie = "0.18"
rand = "0.10"
ulid = { workspace = true }
bytes = "1"
rust-embed = "8"
mime_guess = "2"
openidconnect = { version = "4", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
samael = { version = "0.0.22", features = ["xmlsec"], optional = true }
# Not optional: the MCP transport decodes the `=?base64?...?=` sentinel
# encoding on `Mcp-Name` in every build, not just SAML ones. Costs nothing —
# domarinn-core already depends on base64 unconditionally.
base64 = "0.23"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
# Postgres-backed test runs (DOMARINN_TEST_BACKEND=postgres). When
# DOMARINN_TEST_DATABASE_URL is unset, each test binary starts a throwaway
# postgres container; `mise run test-pg` provides one shared server instead
# so the ~30 test binaries don't each pay container startup.
testcontainers = { version = "0.25", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
flate2 = "1"
ulid = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
openidconnect = { version = "4", default-features = false }
url = "2"

[features]
# SAML SP support. Off by default because samael's xmlsec backend needs C
# libraries (libxmlsec1/libxml2/openssl) at build time; the Docker/release
# build and the dedicated CI job enable it. A binary built without it
# hard-errors at startup if DOMARINN_SAML_PROVIDERS is set.
saml = ["dep:samael"]
