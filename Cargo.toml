[workspace]
resolver = "2"
members = [
    "crates/domarinn-protocol",
    "crates/domarinn-types",
    "crates/domarinn-core",
    "crates/domarinn-cache",
    "crates/domarinn-server",
    "crates/domarinn-cli",
    "crates/domarinn-logging",
    "crates/domarinn-testkit",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/AtvikSecurity/domarinn"
authors = ["Atvik Security"]

[workspace.dependencies]
# Path-only, deliberately: release-please rewrites $.workspace.package.version
# and nothing else, so a `version = "..."` here would go stale on the first
# release and no test would notice. domarinn-protocol has no path dependencies
# of its own, so it is publishable standalone without one.
domarinn-protocol = { path = "crates/domarinn-protocol" }
domarinn-types = { path = "crates/domarinn-types" }
domarinn-core = { path = "crates/domarinn-core" }
# `default-features = false` here so a member that wants only the local disk
# backend actually gets it: cargo ignores a member's `default-features = false`
# unless the workspace entry opts out too, and the failure is silent.
domarinn-cache = { path = "crates/domarinn-cache", default-features = false }
domarinn-server = { path = "crates/domarinn-server" }
domarinn-logging = { path = "crates/domarinn-logging" }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
serde_path_to_error = "0.1"
schemars = { version = "1.0", features = ["preserve_order", "chrono04"] }

# templating
minijinja = { version = "2", features = ["loader", "json", "builtins"] }

# async / http
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util", "signal"] }
async-trait = "0.1"

# hashing / ids
sha2 = "0.11"
blake3 = "1"
ulid = { version = "3", features = ["serde"] }

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "json"] }

# misc
globset = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
strip = true
lto = "thin"

# The dev/test profile drops debuginfo. The SSO stack pulls in a large,
# compile-heavy crypto tree (openidconnect → rsa, num-bigint-dig, p256/p384,
# elliptic-curve); generating debuginfo for it dominates the cold `cargo test`
# compile in both time and peak memory. We do not ship or debug the test
# binaries with a debugger, so line-tables are enough for panic backtraces.
[profile.dev]
debug = "line-tables-only"
