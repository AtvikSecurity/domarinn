---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Build the domarinn container and push it to the Gitea registry at
# ghcr.io, following the bake/digest/merge pipeline from
# AtvikSecurity/containers (.github/workflows/app-builder.yaml there):
#
#   plan   derive tags/labels once (docker/metadata-action) and stage the
#          resulting bake file as an artifact
#   build  one leg per platform: bake + push by digest (no tags yet), with a
#          registry-backed build cache
#   merge  stitch the per-platform digests into one tagged manifest list
#
# Tags: `rolling` tracks main; `v*` git tags produce semver tags (1.2.3, 1.2, 1).
#
# Third-party actions are pinned to the same commit SHAs as the containers
# repo so Renovate can bump them in lockstep.
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Push happens via the registry login (GITEA_USERNAME/GITEA_TOKEN secrets),
# not the workflow token, so the repo only needs to be readable.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/atviksecurity/domarinn
  BUILD_CACHE: ghcr.io/atviksecurity/build_cache

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    steps:
      - name: Build Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          flavor: latest=false
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=rolling,enable={{is_default_branch}}

      - name: Upload Bake Metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domarinn-bake-metadata
          path: ${{ steps.meta.outputs.bake-file }}
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.platform }})
    needs:
      - plan
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the image-all target in docker-bake.hcl.
        # linux/arm64 is disabled - no arm64 runners available.
        platform:
          - linux/amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Target Architecture
        id: target
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "arch=${PLATFORM##*/}" >> "$GITHUB_OUTPUT"

      - name: Login to Gitea Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Download Bake Metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: domarinn-bake-metadata
          path: ${{ runner.temp }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        id: bake
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ runner.temp }}/docker-metadata-action-bake.json
          set: |
            *.cache-from=type=registry,ref=${{ env.BUILD_CACHE }}:domarinn-${{ steps.target.outputs.arch }}
            *.cache-to=type=registry,ref=${{ env.BUILD_CACHE }}:domarinn-${{ steps.target.outputs.arch }},mode=max,compression=zstd,force-compression=true
            *.labels.org.opencontainers.image.vendor=atviksecurity
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.output=type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,compression=zstd,force-compression=true
            *.platform=${{ matrix.platform }}
            *.tags=
          targets: image

      - name: Export Digest
        env:
          DIGEST: ${{ fromJSON(steps.bake.outputs.metadata).image['containerimage.digest'] }}
        run: |-
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domarinn-digests-${{ steps.target.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge
    needs:
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Download Bake Metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: domarinn-bake-metadata
          path: ${{ runner.temp }}

      - name: Download Digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: domarinn-digests-*
          merge-multiple: true

      - name: Login to Gitea Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Create Manifest List and Push
        working-directory: ${{ runner.temp }}/digests
        run: |-
          docker buildx imagetools create \
              $(jq --raw-output --compact-output '.target."docker-metadata-action".tags | map(select(startswith("${{ env.IMAGE }}")) | "-t " + .) | join(" ")' ${{ runner.temp }}/docker-metadata-action-bake.json) \
              $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect Image
        run: |-
          docker buildx imagetools inspect ${{ env.IMAGE }}:$(jq --raw-output '.target."docker-metadata-action".args.DOCKER_META_VERSION' ${{ runner.temp }}/docker-metadata-action-bake.json)
