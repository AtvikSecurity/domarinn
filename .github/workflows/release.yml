name: Release

on:
  push:
    tags:
      - "v*"

# contents: write to create the Release + upload assets. The container image
# is built and pushed to the Gitea registry by .github/workflows/docker.yml,
# which also triggers on v* tags.
permissions:
  contents: write

# --- Action pinning policy: see .github/workflows/ci.yml. `# vX` comments
# mark the version to pin each action to a full commit SHA for hardening. ---

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build the static musl binaries and stage them as workflow artifacts.
  # ---------------------------------------------------------------------------
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross: false
          - target: aarch64-unknown-linux-musl
            cross: true
    # A cross-toolchain hiccup on the aarch64 leg must not block the release of
    # the x86_64 binary; the `release` job attaches whichever binaries built.
    continue-on-error: ${{ matrix.cross }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # pin to SHA

      # mise installs the pinned Rust/Node/pnpm from .mise/config.toml +
      # .mise/mise.lock, the single source of toolchain versions for both CI
      # and releases.
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: node pnpm rust

      # The release binary embeds the web UI, so build web/dist first.
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build

      # mise's rust delegates to rustup, so the native leg adds its cross target
      # the usual way. The cross leg (aarch64) uses `cross`, which supplies the
      # target toolchain inside its own container.
      - name: Add target
        if: ${{ !matrix.cross }}
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 # pin to SHA
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: ${{ !matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools cmake

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p measurellm-cli

      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }} -p measurellm-cli

      - name: Stage artifact
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/measurellm"
          out="dist/measurellm-${{ matrix.target }}"
          cp "$bin" "$out"
          sha256sum "$out" > "$out.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 # pin to SHA
        with:
          name: measurellm-${{ matrix.target }}
          path: dist/*

  # ---------------------------------------------------------------------------
  # 2. Publish a GitHub Release with the binaries attached.
  # ---------------------------------------------------------------------------
  release:
    name: github release
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 # pin to SHA
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 # pin to SHA
        with:
          generate_release_notes: true
          files: |
            dist/measurellm-*

  # ---------------------------------------------------------------------------
  # 3. Build and push the multi-arch Docker image to GHCR. The Dockerfile is
  #    self-contained (it builds the UI + binary internally), so buildx can
  #    build both platforms from the same context.
  # ---------------------------------------------------------------------------
  docker:
    name: docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # pin to SHA

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3 # pin to SHA
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 # pin to SHA

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3 # pin to SHA
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5 # pin to SHA
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 # pin to SHA
        with:
          context: .
          # Multi-arch image. The arm64 layer builds under QEMU emulation, which
          # is slower; GHA layer caching (below) keeps repeat releases cheap.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
