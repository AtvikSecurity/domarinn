name: Release

on:
  push:
    tags:
      - "v*"

# contents: write to create the Release + upload assets.
# packages: write to push the image to GHCR.
permissions:
  contents: write
  packages: write

# --- Action pinning policy: see .github/workflows/ci.yml. `# vX` comments
# mark the version to pin each action to a full commit SHA for hardening. ---

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/perfectra1n/measurellm

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build the static musl binaries and stage them as workflow artifacts.
  # ---------------------------------------------------------------------------
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross: false
          - target: aarch64-unknown-linux-musl
            cross: true
    # A cross-toolchain hiccup on the aarch64 leg must not block the release of
    # the x86_64 binary; the `release` job attaches whichever binaries built.
    continue-on-error: ${{ matrix.cross }}
    steps:
      - uses: actions/checkout@v4 # pin to SHA

      # The release binary embeds the web UI, so build web/dist first.
      - uses: pnpm/action-setup@v4 # pin to SHA
        with:
          version: 11
      - uses: actions/setup-node@v4 # pin to SHA
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build

      - uses: dtolnay/rust-toolchain@stable # pin to SHA
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2 # pin to SHA
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: ${{ !matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools cmake

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p measurellm-cli

      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }} -p measurellm-cli

      - name: Stage artifact
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/measurellm"
          out="dist/measurellm-${{ matrix.target }}"
          cp "$bin" "$out"
          sha256sum "$out" > "$out.sha256"

      - uses: actions/upload-artifact@v4 # pin to SHA
        with:
          name: measurellm-${{ matrix.target }}
          path: dist/*

  # ---------------------------------------------------------------------------
  # 2. Publish a GitHub Release with the binaries attached.
  # ---------------------------------------------------------------------------
  release:
    name: github release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4 # pin to SHA
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2 # pin to SHA
        with:
          generate_release_notes: true
          files: |
            dist/measurellm-*

  # ---------------------------------------------------------------------------
  # 3. Build and push the multi-arch Docker image to GHCR. The Dockerfile is
  #    self-contained (it builds the UI + binary internally), so buildx can
  #    build both platforms from the same context.
  # ---------------------------------------------------------------------------
  docker:
    name: docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4 # pin to SHA

      - uses: docker/setup-qemu-action@v3 # pin to SHA
      - uses: docker/setup-buildx-action@v3 # pin to SHA

      - name: Log in to GHCR
        uses: docker/login-action@v3 # pin to SHA
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5 # pin to SHA
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6 # pin to SHA
        with:
          context: .
          # Multi-arch image. The arm64 layer builds under QEMU emulation, which
          # is slower; GHA layer caching (below) keeps repeat releases cheap.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
