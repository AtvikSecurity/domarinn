name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; the `release` job alone elevates to contents: write to
# create the Release + upload assets. The container image is built and pushed
# to the Gitea registry by .github/workflows/docker.yml, which also triggers
# on v* tags.
permissions:
  contents: read

# --- Action pinning policy: see .github/workflows/ci.yml. `# vX` comments
# mark the version to pin each action to a full commit SHA for hardening. ---

env:
  CARGO_TERM_COLOR: always
  # Same self-hosted runner rustup EXDEV workaround as ci.yml; drop when the runner
  # image mounts all of .rustup on one filesystem.
  RUSTUP_HOME: ${{ runner.temp }}/rustup

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build the static musl binaries and stage them as workflow artifacts.
  # ---------------------------------------------------------------------------
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross: false
          - target: aarch64-unknown-linux-musl
            cross: true
    # A cross-toolchain hiccup on the aarch64 leg must not block the release of
    # the x86_64 binary; the `release` job attaches whichever binaries built.
    continue-on-error: ${{ matrix.cross }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # pin to SHA
        with:
          persist-credentials: false

      # mise installs the pinned Rust/Node/pnpm from .mise/config.toml +
      # .mise/mise.lock, the single source of toolchain versions for both CI
      # and releases. Caching is off: this workflow publishes artifacts, and a
      # poisoned cache entry must never be able to reach a shipped binary.
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: node pnpm rust
          cache: false

      # The release binary embeds the web UI, so build web/dist first.
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build

      # mise's rust delegates to rustup, so the native leg adds its cross target
      # the usual way. The cross leg (aarch64) uses `cross`, which supplies the
      # target toolchain inside its own container.
      # No rust-cache here (unlike ci.yml): release artifacts build from a
      # cold cache so a poisoned cache entry can never reach a shipped binary.
      - name: Add target
        if: ${{ !matrix.cross }}
        run: rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: ${{ !matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools cmake

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p measurellm-cli

      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }} -p measurellm-cli

      - name: Stage artifact
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/measurellm"
          out="dist/measurellm-${{ matrix.target }}"
          cp "$bin" "$out"
          sha256sum "$out" > "$out.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 # pin to SHA
        with:
          name: measurellm-${{ matrix.target }}
          path: dist/*

  # ---------------------------------------------------------------------------
  # 2. Publish a GitHub Release with the binaries attached.
  # ---------------------------------------------------------------------------
  release:
    name: github release
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 # pin to SHA
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        # The action (vs a `gh release create` script step) buys us note
        # generation + idempotent asset replacement in one pinned step.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # pin to SHA # zizmor: ignore[superfluous-actions]
        with:
          generate_release_notes: true
          files: |
            dist/measurellm-*
