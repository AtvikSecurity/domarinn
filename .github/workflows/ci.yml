name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# --- Action pinning policy -------------------------------------------------
# The toolchain (Rust, Node, pnpm) is installed by mise from the pinned
# versions in .mise/config.toml + .mise/mise.lock, via `jdx/mise-action`, which
# is pinned to a full commit SHA. The remaining third-party actions use
# major-version tags for readability; for a hardened setup, pin each to a full
# commit SHA (e.g. `actions/checkout@b4ffde6...  # v4.2.2`) and let
# Renovate/Dependabot bump them. The `# vX` comments mark the intended pin.
# ---------------------------------------------------------------------------

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: rust
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2 # pin to SHA
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2 # pin to SHA
      # `mise run test` == `cargo test --workspace` (see .mise/config.toml).
      - run: mise run test

  web:
    name: web (lint + build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: node pnpm
      # Cache pnpm's content-addressable store (mise provides pnpm; this
      # replaces the store cache that actions/setup-node used to give us).
      - name: Locate pnpm store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4 # pin to SHA
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm -C web install --frozen-lockfile
      # Type-checked lint (--max-warnings=0). The `build` step below runs
      # `tsc -b`, which already fails the job on any type error, so no separate
      # typecheck step is needed.
      - run: pnpm -C web lint
      - run: pnpm -C web build
      - run: pnpm -C web test

  schema-check:
    name: schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2 # pin to SHA
      # Regenerate the schema on the fly and diff it against the committed copy.
      # `diff` exits nonzero (failing the job) on any drift. Keep this in sync
      # with the `schema` task in .mise/config.toml.
      #
      # `set -o pipefail` so a *compile* failure of the generator (left side of
      # the pipe) fails the job instead of being masked by `diff`'s exit code
      # (which would otherwise read as "schema out of date").
      - name: Fail on schema drift
        run: |
          set -o pipefail
          if ! cargo run -q -p measurellm-cli -- schema config | diff -u measurellm.schema.json -; then
            echo "::error::measurellm.schema.json is out of date. Run 'mise run schema' and commit the result."
            exit 1
          fi

  gen-types-check:
    name: generated TS types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2 # pin to SHA
      # Regenerate the TypeScript DTOs into their committed location and fail
      # if they differ. Keep in sync with the `gen-types` task in
      # .mise/config.toml.
      - name: Generate types
        run: cargo run -q -p measurellm-cli -- gen-types web/src/api/generated
      - name: Fail on drift
        run: |
          if [ -z "$(git ls-files web/src/api/generated)" ]; then
            echo "::error::web/src/api/generated is not committed. Run 'mise run gen-types' and commit the result."
            exit 1
          fi
          # `git status --porcelain`, not `git diff`: newly-generated files
          # that git diff can't see (untracked) must also count as drift.
          if [ -n "$(git status --porcelain -- web/src/api/generated)" ]; then
            echo "::error::web/src/api/generated is out of date. Run 'mise run gen-types' and commit the result."
            git --no-pager status --porcelain -- web/src/api/generated
            exit 1
          fi
          echo "generated types are up to date"

  musl-build:
    name: static musl build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CI proves the static build links on x86_64. aarch64 is verified at
        # release time (see release.yml), where a cross toolchain is set up.
        target: [x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: rust
      # mise's rust delegates to rustup, so the cross target is added the usual
      # way (mise pins the toolchain; rustup adds the target to it).
      - name: Add musl target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2 # pin to SHA
        with:
          key: ${{ matrix.target }}

      # musl-tools gives the C toolchain rusqlite's bundled SQLite (and the
      # rustls crypto backend) need; cmake is a hedge for crypto backends.
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools cmake

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p measurellm-cli

      - name: Confirm the binary is static
        run: file target/${{ matrix.target }}/release/measurellm || true
