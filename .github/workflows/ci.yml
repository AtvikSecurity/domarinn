name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# --- Action pinning policy -------------------------------------------------
# Third-party actions below use major-version tags for readability. For a
# hardened setup, pin each to a full commit SHA (e.g.
# `actions/checkout@b4ffde6...  # v4.2.2`) and let Renovate/Dependabot bump
# them. The `# vX` comments mark the intended version to pin to.
# ---------------------------------------------------------------------------

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: dtolnay/rust-toolchain@stable # pin to SHA
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: dtolnay/rust-toolchain@stable # pin to SHA
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2 # pin to SHA
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: dtolnay/rust-toolchain@stable # pin to SHA
      - uses: Swatinem/rust-cache@v2 # pin to SHA
      - run: cargo test --workspace

  web:
    name: web (lint + build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: pnpm/action-setup@v4 # pin to SHA
        with:
          version: 11
      - uses: actions/setup-node@v4 # pin to SHA
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      # Type-checked lint (--max-warnings=0). The `build` step below runs
      # `tsc -b`, which already fails the job on any type error, so no separate
      # typecheck step is needed.
      - run: pnpm -C web lint
      - run: pnpm -C web build
      - run: pnpm -C web test

  schema-check:
    name: schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: dtolnay/rust-toolchain@stable # pin to SHA
      - uses: Swatinem/rust-cache@v2 # pin to SHA
      # Regenerate the schema on the fly and diff it against the committed copy.
      # `diff` exits nonzero (failing the job) on any drift. Keep this in sync
      # with the `schema` recipe in the justfile.
      - name: Fail on schema drift
        run: |
          if ! cargo run -q -p measurellm-cli -- schema config | diff -u measurellm.schema.json -; then
            echo "::error::measurellm.schema.json is out of date. Run 'just schema' and commit the result."
            exit 1
          fi

  gen-types-check:
    name: generated TS types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: dtolnay/rust-toolchain@stable # pin to SHA
      - uses: Swatinem/rust-cache@v2 # pin to SHA
      # Regenerate the TypeScript DTOs into their committed location and fail
      # if they differ. Keep in sync with the `gen-types` recipe in the
      # justfile.
      - name: Generate types
        run: cargo run -q -p measurellm-cli -- gen-types web/src/api/generated
      - name: Fail on drift
        run: |
          if [ -z "$(git ls-files web/src/api/generated)" ]; then
            echo "::error::web/src/api/generated is not committed. Run 'just gen-types' and commit the result."
            exit 1
          fi
          # `git status --porcelain`, not `git diff`: newly-generated files
          # that git diff can't see (untracked) must also count as drift.
          if [ -n "$(git status --porcelain -- web/src/api/generated)" ]; then
            echo "::error::web/src/api/generated is out of date. Run 'just gen-types' and commit the result."
            git --no-pager status --porcelain -- web/src/api/generated
            exit 1
          fi
          echo "generated types are up to date"

  musl-build:
    name: static musl build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CI proves the static build links on x86_64. aarch64 is verified at
        # release time (see release.yml), where a cross toolchain is set up.
        target: [x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: dtolnay/rust-toolchain@stable # pin to SHA
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2 # pin to SHA
        with:
          key: ${{ matrix.target }}

      # musl-tools gives the C toolchain rusqlite's bundled SQLite (and the
      # rustls crypto backend) need; cmake is a hedge for crypto backends.
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools cmake

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p measurellm-cli

      - name: Confirm the binary is static
        run: file target/${{ matrix.target }}/release/measurellm || true
