name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# --- Action pinning policy -------------------------------------------------
# Third-party actions below use major-version tags for readability. For a
# hardened setup, pin each to a full commit SHA (e.g.
# `actions/checkout@b4ffde6...  # v4.2.2`) and let Renovate/Dependabot bump
# them. The `# vX` comments mark the intended version to pin to.
# ---------------------------------------------------------------------------

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: dtolnay/rust-toolchain@stable # pin to SHA
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: dtolnay/rust-toolchain@stable # pin to SHA
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2 # pin to SHA
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: dtolnay/rust-toolchain@stable # pin to SHA
      - uses: Swatinem/rust-cache@v2 # pin to SHA
      - run: cargo test --workspace

  web:
    name: web (build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: pnpm/action-setup@v4 # pin to SHA
      - uses: actions/setup-node@v4 # pin to SHA
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - run: pnpm -C web test -- --run

  schema-check:
    name: schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: dtolnay/rust-toolchain@stable # pin to SHA
      - uses: Swatinem/rust-cache@v2 # pin to SHA
      # Regenerate the checked-in schema and fail if it drifts. Keep this in
      # sync with the `schema` recipe in the justfile.
      - name: Regenerate config schema
        run: cargo run -p measurellm-cli -- schema config > measurellm.schema.json
      - name: Fail on drift
        run: |
          if ! git diff --exit-code --stat measurellm.schema.json; then
            echo "::error::measurellm.schema.json is out of date. Run 'just schema' and commit the result."
            git --no-pager diff measurellm.schema.json
            exit 1
          fi

  musl-build:
    name: static musl build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross: false
          # aarch64 proves the static build links for arm64 too. It needs a
          # cross linker; `cross` handles that transparently. Marked
          # experimental so a toolchain hiccup does not block the x86_64 gate.
          - target: aarch64-unknown-linux-musl
            cross: true
    continue-on-error: ${{ matrix.cross }}
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: dtolnay/rust-toolchain@stable # pin to SHA
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2 # pin to SHA
        with:
          key: ${{ matrix.target }}

      # Native musl target: musl-tools gives us the C toolchain rusqlite's
      # bundled SQLite (and ring) need. cmake is a hedge for crypto backends.
      - name: Install musl toolchain
        if: ${{ !matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools cmake

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p measurellm-cli

      # Cross target: use `cross` to get the right linker + sysroot in a
      # container, avoiding fiddly aarch64 cross-compiler setup on the runner.
      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }} -p measurellm-cli

      - name: Confirm the binary is static
        run: file target/${{ matrix.target }}/release/measurellm || true
