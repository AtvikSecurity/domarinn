name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# --- Action pinning policy -------------------------------------------------
# The toolchain (Rust, Node, pnpm) is installed by mise from the pinned
# versions in .mise/config.toml + .mise/mise.lock, via `jdx/mise-action`, which
# is pinned to a full commit SHA. The remaining third-party actions use
# major-version tags for readability; for a hardened setup, pin each to a full
# commit SHA (e.g. `actions/checkout@b4ffde6...  # v4.2.2`) and let
# Renovate/Dependabot bump them. The `# vX` comments mark the intended pin.
# ---------------------------------------------------------------------------

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # WORKAROUND for the self-hosted runner: its persistent /home/runner/.rustup has
  # toolchains/ and tmp/ on different filesystems, so every rustup
  # install/update dies with EXDEV ("Invalid cross-device link"). Keeping
  # RUSTUP_HOME beside the checkout (one filesystem, and `runner.temp` is not
  # a valid context in workflow-level env) sidesteps that at the cost of a
  # fresh toolchain download per job. Drop this once the runner image mounts
  # all of .rustup on one filesystem.
  RUSTUP_HOME: ${{ github.workspace }}/../rustup

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # pin to SHA
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          install_args: rust
      # Every gate below is a mise task, so `mise run <task>` locally runs the
      # exact same command as CI (`mise run ci` runs the whole matrix).
      - run: mise run fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # pin to SHA
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1 # pin to SHA
      - run: mise run clippy

  test:
    name: test
    runs-on: ubuntu-24.04
    # Runs in the rust:bookworm container (like the saml job) rather than
    # directly on the runner: the bare runner's cold compile of the new SSO
    # crypto dependency tree was slow/heavy enough to get the job killed
    # before it finished (and before rust-cache could save, so every rerun
    # stayed cold). The container has a warm toolchain + reliable caching.
    container: rust:1-bookworm
    env:
      # The workflow-level EXDEV workaround points RUSTUP_HOME outside this
      # container; use the image's own rustup install instead.
      RUSTUP_HOME: /usr/local/rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # pin to SHA
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1 # pin to SHA
        with:
          key: test
      # Equivalent to `mise run test` (== `cargo test --workspace`) without
      # pulling mise's toolchain into the container.
      - run: cargo test --workspace

  saml:
    name: saml (feature-gated tests)
    runs-on: ubuntu-24.04
    # rust:bookworm brings its own toolchain + the apt packages samael's
    # xmlsec backend needs at build time; mise is not used here.
    container: rust:1-bookworm
    env:
      # The workflow-level EXDEV workaround points RUSTUP_HOME at the
      # runner's workspace; inside this container the image's own rustup
      # install is the right one.
      RUSTUP_HOME: /usr/local/rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # pin to SHA
        with:
          persist-credentials: false
      - name: Install xmlsec build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libxmlsec1-dev libxml2-dev libxslt1-dev libssl-dev libltdl-dev \
            pkg-config clang
      # The rust:bookworm image ships rustc/cargo but not the clippy
      # component; the other CI jobs get it via mise-action.
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1 # pin to SHA
        with:
          key: saml
      - run: cargo clippy -p domarinn-server --features saml --all-targets -- -D warnings
      - run: cargo test -p domarinn-server --features saml

  web:
    name: web (lint + build + vitest)
    runs-on: ubuntu-24.04
    # The suite takes seconds; anything approaching this is a hang, not slowness.
    # Without a bound a wedged run burned ~14 minutes and still produced no logs,
    # which is the worst of both — slow *and* undiagnosable.
    timeout-minutes: 10
    env:
      # `mise run` auto-installs every tool in .mise/config.toml, which would
      # pull in the Rust toolchain this job never uses — skip it.
      MISE_DISABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # pin to SHA
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          install_args: node pnpm
      # Cache pnpm's content-addressable store (mise provides pnpm; this
      # replaces the store cache that actions/setup-node used to give us).
      - name: Locate pnpm store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # pin to SHA
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: mise run web-install
      # Type-checked lint (--max-warnings=0). The `web-build` task runs
      # `tsc -b`, which already fails the job on any type error, so no separate
      # typecheck step is needed.
      - run: mise run web-lint
      - run: mise run web-build
      - run: mise run web-test

  schema-check:
    name: schema is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # pin to SHA
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1 # pin to SHA
      # Regenerates the schema and diffs it against the committed copy; the
      # full logic lives in the `schema-check` task (.mise/config.toml) so the
      # local run and CI can never drift apart.
      - name: Fail on schema drift
        run: mise run schema-check

  gen-types-check:
    name: generated TS types are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # pin to SHA
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1 # pin to SHA
      # Regenerates the TypeScript DTOs and fails on any drift (including
      # untracked new files); the full logic lives in the `gen-types-check`
      # task (.mise/config.toml) so the local run and CI can never drift apart.
      - name: Fail on generated-type drift
        run: mise run gen-types-check

  musl-build:
    name: static musl build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # CI proves the static build links on x86_64. aarch64 is verified at
        # release time (see release.yml), where a cross toolchain is set up.
        target: [x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # pin to SHA
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1 # pin to SHA
        with:
          key: ${{ matrix.target }}

      # musl-tools gives the C toolchain rusqlite's bundled SQLite (and the
      # rustls crypto backend) need; cmake is a hedge for crypto backends.
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools cmake

      # The `musl-build` task adds the rustup target itself (mise's rust
      # delegates to rustup) and then builds; same command locally and in CI.
      - name: Build
        run: mise run musl-build

      - name: Confirm the binary is static
        run: file target/${{ matrix.target }}/release/domarinn || true
