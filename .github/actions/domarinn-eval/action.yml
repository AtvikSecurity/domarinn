# domarinn-eval — run a domarinn suite in CI and gate the PR on the result.
#
# Fully functional: resolves a `domarinn` binary, runs a suite, summarizes it
# with `domarinn ci-summary`, uploads the JUnit report, comments the Markdown
# summary on the PR, and gates the job on the CLI's exit code.
#
# The headline numbers come from `ci-summary`, which writes them straight to
# $GITHUB_OUTPUT — nothing here regex-parses a report.
#
# Usage:
#   - uses: AtvikSecurity/domarinn/.github/actions/domarinn-eval@0.1.0
#     with:
#       config: eval/domarinn.yaml
#       server-url: https://domarinn.example.com   # optional (enables --share)
#       token: ${{ secrets.DOMARINN_TOKEN }}        # optional bearer token
#       against: server:baseline                      # optional baseline to diff
#       fail-on-regression: "true"
#
# Exit-code contract (from the CLI): 0 = all pass; 1 = assertion failure or
# regression; 2 = config/usage error; 3 = infrastructure error. This action maps
# 1 to a failed check only when `fail-on-regression` is true; 2 and 3 always fail
# the job. The artifact upload and the PR comment run regardless of the result.

name: domarinn eval
description: Run a domarinn eval suite, gate on regressions, and comment the result on the PR.

inputs:
  config:
    description: Path to the suite file or a directory containing domarinn.yaml.
    required: false
    default: "domarinn.yaml"
  binary-path:
    description: >-
      Path to a prebuilt `domarinn` binary. When set, resolution stops here
      (no download, no build).
    required: false
    default: ""
  version:
    description: >-
      Release tag to download the binary from (e.g. "0.1.0"), or "latest".
      Used only when `binary-path` is empty. If the download fails, the action
      falls back to building/installing from source with cargo.
    required: false
    default: "latest"
  server-url:
    description: >-
      Results server base URL. When set, the run is uploaded with `--share`
      (exported as DOMARINN_SERVER_URL). Optional.
    required: false
    default: ""
  token:
    description: >-
      Bearer token for the results server (exported as DOMARINN_TOKEN). Pass a
      secret, never a literal. Optional.
    required: false
    default: ""
  against:
    description: >-
      Baseline to diff this run against. Use "server:baseline" in CI: it
      resolves the baseline pinned for this suite on the results server, and
      needs `server-url` plus `project:`/`suite:` in the config. "latest" reads
      the local .domarinn/runs store, which a fresh checkout does not have — in
      CI it silently finds nothing and the gate never fires. Also accepts a run
      id or a result.json path. Empty disables the diff. A regression makes the
      CLI exit 1; a baseline that was requested but could not be resolved makes
      it exit 2.
    required: false
    default: ""
  fail-on-regression:
    description: >-
      If "true" (default), an assertion failure or regression (CLI exit 1) fails
      the check. If "false", exit 1 is reported as a warning and does not fail
      the job. Exit 2 (config/usage) and exit 3 (infra) always fail the job.
    required: false
    default: "true"
  comment:
    description: If "true" (default), post/update a summary comment on the PR.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact holding results.xml and summary.md.
    required: false
    default: "domarinn-results"

outputs:
  exit-code:
    description: The CLI's raw exit code (0 pass, 1 fail/regression, 2 usage, 3 infra).
    value: ${{ steps.eval.outputs.exit-code }}
  passed:
    description: Number of test cases that passed.
    value: ${{ steps.summary.outputs.passed }}
  failed:
    description: Number of test cases that failed or errored.
    value: ${{ steps.summary.outputs.failed-or-errored }}
  errored:
    description: Number of test cases that errored (a subset of `failed`).
    value: ${{ steps.summary.outputs.errored }}
  total:
    description: Total number of test cases.
    value: ${{ steps.summary.outputs.total }}
  pass-rate:
    description: Percentage of cases that passed, one decimal place (e.g. "91.7").
    value: ${{ steps.summary.outputs.pass-rate }}
  cache-hit-rate:
    description: Percentage of cases served from the cache, one decimal place.
    value: ${{ steps.summary.outputs.cache-hit-rate }}
  regressed:
    description: Number of tests that newly regressed vs the baseline (0 without `against`).
    value: ${{ steps.summary.outputs.regressed }}
  run-url:
    description: URL of the uploaded run on the results server (empty without `server-url`).
    value: ${{ steps.summary.outputs.run-url }}
  summary-path:
    description: Path to the Markdown summary.
    value: ${{ steps.summary.outputs.summary-path }}
  results-path:
    description: Path to the JUnit XML report written by the run.
    value: ${{ steps.eval.outputs.results-path }}

runs:
  using: composite
  steps:
    # -- Resolve the binary: provided path -> release download -> build. -------
    - name: Resolve domarinn binary
      id: bin
      shell: bash
      env:
        INPUT_BINARY_PATH: ${{ inputs.binary-path }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -uo pipefail

        if [ -n "${INPUT_BINARY_PATH}" ]; then
          echo "Using provided binary: ${INPUT_BINARY_PATH}"
          echo "path=${INPUT_BINARY_PATH}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # `arch` is what the released filename uses; `legacy_target` is the Rust
        # triple 0.1.3 and earlier were named after.
        machine="$(uname -m)"
        case "$machine" in
          x86_64)  arch=amd64; legacy_target=x86_64-unknown-linux-musl ;;
          aarch64|arm64) arch=arm64; legacy_target=aarch64-unknown-linux-musl ;;
          *) echo "::error::unsupported arch $machine"; exit 3 ;;
        esac

        base="https://github.com/AtvikSecurity/domarinn/releases"
        ver="${INPUT_VERSION}"
        if [ "$ver" = "latest" ]; then
          # Asset names carry the version, so "latest" has to become a concrete
          # tag before a URL exists — GitHub has no wildcard in
          # /releases/latest/download/. It does redirect /releases/latest to
          # /releases/tag/<tag>, and reading that needs no token and is not
          # rate-limited the way unauthenticated api.github.com is.
          ver="$(curl -fsSLI -o /dev/null -w '%{url_effective}' "${base}/latest" | sed 's#.*/tag/##')"
          if [ -z "$ver" ] || [ "$ver" = "latest" ]; then
            echo "::error::could not resolve the latest domarinn release tag"
            exit 3
          fi
          echo "Resolved latest to ${ver}"
        fi
        ver="${ver#v}"

        # Second URL covers 0.1.3 and earlier, which named assets after the Rust
        # target triple and carried no version. Without it, pinning an older
        # release would silently fall through to a much slower source build.
        urls=(
          "${base}/download/${ver}/domarinn_${ver}_linux_${arch}"
          "${base}/download/${ver}/domarinn-${legacy_target}"
        )
        for url in "${urls[@]}"; do
          echo "Downloading $url"
          if curl -fsSL "$url" -o domarinn; then
            chmod +x domarinn
            echo "path=$(pwd)/domarinn" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done

        # Fallback: build from source. Prefer a local checkout of this repo;
        # otherwise install straight from git. Requires a Rust toolchain.
        echo "::warning::no release asset for ${ver} on ${arch}; building domarinn from source"
        if ! command -v cargo >/dev/null 2>&1; then
          echo "::error::no prebuilt binary available and cargo is not installed (add dtolnay/rust-toolchain before this action)"
          exit 3
        fi
        root="${RUNNER_TEMP}/domarinn-install"
        if [ -f "${GITHUB_WORKSPACE}/crates/domarinn-cli/Cargo.toml" ]; then
          cargo install --path "${GITHUB_WORKSPACE}/crates/domarinn-cli" --locked --root "$root"
        else
          cargo install --git https://github.com/AtvikSecurity/domarinn --locked --root "$root" domarinn-cli
        fi
        echo "path=${root}/bin/domarinn" >> "$GITHUB_OUTPUT"

    # -- Run the suite: JUnit report, optional baseline + upload. ---------------
    - name: Run eval
      id: eval
      shell: bash
      env:
        DOMARINN_BIN: ${{ steps.bin.outputs.path }}
        DOMARINN_SERVER_URL: ${{ inputs.server-url }}
        DOMARINN_TOKEN: ${{ inputs.token }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_AGAINST: ${{ inputs.against }}
      run: |
        # No `set -e`: we must capture the CLI exit code and keep going so the
        # summary, artifact upload, PR comment, and gate step still run.
        set -uo pipefail

        results="results.xml"

        args=(run "${INPUT_CONFIG}" --format junit --out "${results}")
        [ -n "${INPUT_AGAINST}" ] && args+=(--against "${INPUT_AGAINST}")
        # Upload the run when a server is configured (token via DOMARINN_TOKEN).
        # `--share` also records the run's URL on the stored run, which is where
        # the summary step reads it from.
        [ -n "${DOMARINN_SERVER_URL}" ] && args+=(--share)

        echo "Running: domarinn ${args[*]}"
        "${DOMARINN_BIN}" "${args[@]}"
        code=$?
        echo "domarinn exited with $code"

        {
          echo "exit-code=$code"
          echo "results-path=${results}"
        } >> "$GITHUB_OUTPUT"

    # -- Summarize: markdown for the PR/job summary + the headline numbers as
    # step outputs. `ci-summary` writes the `key=value` pairs to $GITHUB_OUTPUT
    # itself, so nothing here parses the report. It is a reporter and always
    # exits 0 on a completed run; the gate step below owns the verdict.
    - name: Summarize
      id: summary
      if: ${{ always() && steps.eval.conclusion != 'skipped' }}
      shell: bash
      env:
        DOMARINN_BIN: ${{ steps.bin.outputs.path }}
        # The same server credentials the eval step gets. Without them
        # `--against server:baseline` cannot resolve anything here, so the PR
        # comment silently loses its comparison table and the `regressed`
        # output is hard-zero for every caller using the documented CI default.
        DOMARINN_SERVER_URL: ${{ inputs.server-url }}
        DOMARINN_TOKEN: ${{ inputs.token }}
        INPUT_AGAINST: ${{ inputs.against }}
      run: |
        set -uo pipefail

        summary="summary.md"
        args=(ci-summary latest --out "${summary}")
        [ -n "${INPUT_AGAINST}" ] && args+=(--against "${INPUT_AGAINST}")

        if ! "${DOMARINN_BIN}" "${args[@]}"; then
          # A suite that never ran (bad config, missing binary) persists no run,
          # so there is nothing to summarize. Say so rather than leaving the PR
          # comment and job summary blank.
          echo "::warning::no completed run to summarize"
          printf '### domarinn eval\n\n_The suite did not produce a run; see the job log._\n' > "${summary}"
        fi

        echo "summary-path=${summary}" >> "$GITHUB_OUTPUT"
        cat "${summary}" >> "$GITHUB_STEP_SUMMARY"

    # -- Upload the JUnit report + summary as an artifact (always). -------------
    - name: Upload results
      if: ${{ always() && steps.eval.outputs.results-path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 # pin to SHA
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.eval.outputs.results-path }}
          ${{ steps.summary.outputs.summary-path }}
        if-no-files-found: warn

    # -- Comment the summary on the PR (create-or-update a single comment). -----
    - name: Comment on PR
      if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 # pin to SHA
      env:
        SUMMARY_PATH: ${{ steps.summary.outputs.summary-path }}
      with:
        script: |
          const fs = require('fs');
          const path = process.env.SUMMARY_PATH;
          const marker = '<!-- domarinn-eval -->';
          let body = `${marker}\n### domarinn eval\n\n_No summary was produced._`;
          try {
            body = `${marker}\n` + fs.readFileSync(path, 'utf8');
          } catch (e) {
            core.warning(`no summary at ${path}: ${e}`);
          }
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    # -- Gate the job on the CLI exit code (runs after upload + comment). -------
    - name: Gate on result
      if: ${{ always() }}
      shell: bash
      env:
        CODE: ${{ steps.eval.outputs.exit-code }}
        FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
      run: |
        set -uo pipefail
        code="${CODE:-3}"
        case "$code" in
          0)
            echo "domarinn: all checks passed"
            ;;
          1)
            if [ "${FAIL_ON_REGRESSION}" = "true" ]; then
              echo "::error::domarinn reported assertion failures or regressions (exit 1)"
              exit 1
            fi
            echo "::warning::domarinn reported failures/regressions (exit 1, not gated)"
            ;;
          2)
            echo "::error::domarinn config/usage error (exit 2)"
            exit 2
            ;;
          3)
            echo "::error::domarinn infrastructure error (exit 3)"
            exit 3
            ;;
          *)
            echo "::error::domarinn exited with $code"
            exit "$code"
            ;;
        esac
